# direct_call_llm 配置

log_file: "direct_call_llm_llama3.log"

# LLM 配置（内联，不再依赖 llm_config.json）
llm_provider: "llama3"
llm:
  model: "llama-3"
  api_key_env: "123"
  base_url: "http://192.168.1.101:60103/v1"
  context_length: 8192

# 批量分析时每个包的结果文件名
result_filename: "llama3.json"

# 增量扫描月份范围
start_month: "2022-02"
end_month: "2024-12"
